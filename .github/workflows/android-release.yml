name: Android release channels

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish from master or a matching stable tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never interrupt a rolling asset replacement or a stable draft upload.
concurrency:
  group: studyhabit-android-release
  cancel-in-progress: false

jobs:
  backend-web:
    uses: ./.github/workflows/build-apk.yml

  checks:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Release policy tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Android checks and unsigned build
        working-directory: android
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" testDebugUnitTest lintDebug assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studyhabit-unsigned-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: [checks, backend-web]
    timeout-minutes: 60
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate channel, version and provenance before signing
        id: version
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android_release.py prepare
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Configure dedicated release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 scripts/android_release.py configure-signing
      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -Pstudyhabit.release.signing.enabled=true assembleRelease bundleRelease
      - name: Verify signing identity, metadata and checksums
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$BUNDLETOOL_JAR"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $BUNDLETOOL_JAR" | sha256sum -c -
          python3 scripts/android_release.py stage
      - name: Retain verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studyhabit-verified-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
      - name: Publish selected channel
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: python3 scripts/android_release.py publish
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/app/key.properties "$RUNNER_TEMP/studyhabit-release.keystore"
